# Publishes this repo to GitHub Pages on every push to main.
#
# Replaces the classic "deploy from a branch" build. From 2026-11-06 nearly
# every classic deploy of this site sat in "syncing files" until its
# 10-minute limit and failed, so nothing new went live. This uploads the
# files as they are (the site has no Jekyll content to process); the first
# run on 2026-11-10 deployed in 37 seconds. deploy-pages allows at most 10
# minutes for the sync either way, so if deploys start timing out again, the
# fix is a smaller site: each game's canvaskit/ folder is 37 MB, most of it
# renderers the games never load.
name: Deploy sandbox to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
