# Publishes this repo to GitHub Pages on every push to main.
#
# Replaces the classic "deploy from a branch" build. From 2026-11-06 nearly
# every classic deploy of this site sat in "syncing files" until its
# 10-minute limit and failed, so nothing new went live. This uploads the
# files as they are (the site has no Jekyll content to process); the first
# run on 2026-11-10 deployed in 37 seconds. deploy-pages allows at most 10
# minutes for the sync either way, which is why the deploy step below retries
# once. The site was also shrunk for it (2026-11-10): the games now share one
# trimmed CanvasKit copy per engine build under /flutter-canvaskit/ instead of
# a 37 MB canvaskit/ each (see any game's deploy_to_io.ps1).
name: Deploy sandbox to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Publishes only the newest commit. Each run deploys the commit that
  # triggered it, so a run held up for hours (the 2026-11-11 Actions outage
  # left one queued that could be neither cancelled nor deleted) would put an
  # older site over everything pushed since. This checks that the run's commit
  # is still the tip of main; if not, it skips the deploy and says why.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: this run is for ${{ github.sha }}, but main is now at $tip. Deploying it would put an older site over a newer one."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # One artifact NAME per attempt. A re-run keeps the earlier attempt's
      # artifact, and deploy-pages refuses a run holding two artifacts with the
      # same name ("Multiple artifacts named github-pages"), so re-running a
      # failed deploy used to fail in under a second, every time.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      # GitHub's file sync sometimes stalls (sitting in syncing_files, or
      # reporting no status at all) until deploy-pages' 10-minute cap. When it
      # does, deploy-pages cancels that deployment; one more try with the same
      # artifact usually goes straight through. The job fails only if both do.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
