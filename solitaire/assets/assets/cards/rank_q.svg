<!-- Polar Bear for the Queen -- from Canoku's polar_bear.svg.

     GENERATED by tools/convert_animals.py. Edit the Canoku source and re-run
     rather than editing this file:  python tools/convert_animals.py

     Two things were done to it, both forced by how cards render art:

       * The white outline layer was removed. Canoku draws every shape twice,
         once as a thick white sticker outline and once as flat colour. White
         is invisible on Canoku's background, but this card tints every colour
         to one ink -- so those outlines would flood the drawing solid.

       * Colour became opacity. The card applies
         ColorFilter.mode(ink, srcIn), which keeps only the alpha channel;
         that is what lets ONE file serve all four suits, drawn tinted red or
         black and mirrored or not. Each fill was mapped by relative
         luminance -- normalised across this file's own range, so every
         character carries the same weight on the card regardless of how
         dark its source palette happened to be:

             #4b3f4e   luminance 0.26  ->  opacity 0.95
             #5d5360   luminance 0.34  ->  opacity 0.848
             #646266   luminance 0.39  ->  opacity 0.78
             #939393   luminance 0.58  ->  opacity 0.648
             #9b9b9b   luminance 0.61  ->  opacity 0.598
             #adadad   luminance 0.68  ->  opacity 0.532
             #b2b2b2   luminance 0.70  ->  opacity 0.491
             #c7c5c9   luminance 0.78  ->  opacity 0.424
             #dad8db   luminance 0.85  ->  opacity 0.361
             #eceaec   luminance 0.92  ->  opacity 0.3
-->
